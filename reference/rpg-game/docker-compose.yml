# Hắc Long: game + PostgreSQL. Xem docs/DEPLOY.md.
#   cp .env.example .env   # rồi sửa các giá trị
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hac_long
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: hac_long
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hac_long -d hac_long"]
      interval: 5s
      timeout: 5s
      retries: 10
    # không mở cổng database ra ngoài

  app:
    build: .
    image: hac_long:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://hac_long:${POSTGRES_PASSWORD}@db/hac_long
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?đặt SECRET_KEY_BASE trong .env}
      PHX_HOST: ${PHX_HOST:?đặt PHX_HOST (IP hoặc domain) trong .env}
      PHX_SCHEME: ${PHX_SCHEME:-https}
      PHX_URL_PORT: ${PHX_URL_PORT:-}
      CHECK_ORIGIN: ${CHECK_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PHX_IPV6: ${PHX_IPV6:-}
      # số người chơi AI (trống = mặc định RULES.bots.count = 0, tức tắt)
      HL_BOTS: ${HL_BOTS:-}
      PORT: "4000"
      POOL_SIZE: "10"
    ports:
      # APP_BIND=127.0.0.1 khi đã có TLS proxy trên cùng máy (chỉ proxy vào được cổng 4000)
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-4000}:4000"
    volumes:
      # Hình đồ gốc MU (không nằm trong git / image, CLAUDE.md §7): thư mục trên VPS có `mu_items/` và
      # `item_icons.json` (sinh trên máy dev bằng scripts/setup_items.sh rồi rsync lên). Gắn chỉ đọc vào đúng chỗ game
      # tìm hình. Thư mục trống / thiếu thì đồ hiện hình thay thế, game vẫn chạy. Xem docs/DEPLOY.md "Hình đồ gốc MU".
      # Đường dẫn trong container có số phiên bản (mix.exs `version`); đổi phiên bản thì sửa theo.
      - ${HL_ICONS_DIR:-../../../mmo-rpg-game-items/icons}/mu_items:/app/lib/hac_long-0.1.0/priv/static/assets/mu_items:ro
      - ${HL_ICONS_DIR:-../../../mmo-rpg-game-items/icons}/item_icons.json:/app/lib/hac_long-0.1.0/priv/static/assets/item_icons.json:ro

volumes:
  db:
